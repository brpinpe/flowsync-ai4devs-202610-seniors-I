name: OpenAPI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Arrancar la app exige un .env válido (start/env.ts); la clave solo
      # sirve para pasar esa validación.
      - run: cp .env.example .env && node ace generate:key
      - run: npm run openapi:check
